[project]
name = "sitecheck"
version = "0.1.0"
description = "Audit whether a medical-ML result measures biology or the lab that produced the data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ruben Haisma" }]
keywords = ["computational-pathology", "batch-effects", "external-validation", "confounding"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
sitecheck = "sitecheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitecheck"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
